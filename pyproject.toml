[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugphyzz"
version = "0.0.1"
description = "Microbial physiological trait annotations and ancestral-state reconstruction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Nash Rochman" }
]
license = { text = "MIT" }
keywords = [
  "microbiology",
  "phylogenetics",
  "ancestral-state-reconstruction",
  "microbial-traits",
  "bioinformatics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "platformdirs>=4.0",
  "biopython>=1.80",
]

[project.urls]
Homepage = "https://waldronlab.io/bugphyzz/"
Documentation = "https://waldronlab.io/bugphyzz/"
Data = "https://doi.org/10.5281/zenodo.12574596"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
  "twine>=5",
  "check-wheel-contents>=0.6",
]

taxonomy = [
  "ete3>=3.1.3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bugphyzz = [
  "resources/*.tsv",
  "resources/*.txt",
  "resources/*.newick",
  "resources/*.tip_data",
  "resources/*.node_data",
  "resources/*.ntree",
  "resources/*.zip",
  "resources/taxonomy_2023/*.tsv",
  "resources/taxonomy_2023/*.newick",
  "resources/taxonomy_2023/*.ntree",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
